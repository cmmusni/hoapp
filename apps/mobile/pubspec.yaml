name: mobile
description: HOApp Mobile App for Residents
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  core_ui:
    path: ../../packages/core_ui
  core_domain:
    path: ../../packages/core_domain
  core_data:
    path: ../../packages/core_data
  provider: ^6.1.1
  uni_links: ^0.5.1
  intl: ^0.19.0
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  flutter_colorpicker: ^1.1.0
  file_picker: ^6.2.1
  supabase_flutter: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
