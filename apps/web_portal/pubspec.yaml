name: web_portal
description: HOApp Web Portal (Marketing + SaaS + Community Portal)
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  core_ui:
    path: ../../packages/core_ui
  core_domain:
    path: ../../packages/core_domain
  core_data:
    path: ../../packages/core_data
  go_router: ^13.0.0
  provider: ^6.1.1
  url_strategy: ^0.2.0
  file_picker: ^6.1.1
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
