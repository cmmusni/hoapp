name: web_portal
description: HOApp Web Portal (Marketing + SaaS + Community Portal)
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  core_ui:
    path: ../../packages/core_ui
  core_domain:
    path: ../../packages/core_domain
  core_data:
    path: ../../packages/core_data
  go_router: ^13.0.0
  provider: ^6.1.1
  url_strategy: ^0.2.0
  file_picker: ^8.0.0
  intl: any
  flex_color_scheme: ^8.1.0
  responsive_framework: ^1.5.1
  data_table_2: ^2.5.15
  table_calendar: ^3.1.3
  fl_chart: ^0.70.2
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.0
  flutter_colorpicker: ^1.1.0
  mobile_scanner: ^7.2.0
  crypto: ^3.0.3
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/features/
    - assets/icons/
